name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist

      - name: Save unsigned build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lastro.app-windows-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14
