<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Lastro · Visão rápida</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body.compact-body { min-width: 0; min-height: 100vh; margin: 0; padding: 20px; color: #e6ecf5; background: radial-gradient(ellipse at 92% 0, rgba(91,141,239,.13), transparent 42%), #0b1220; font-family: inherit; }
    .compact-shell { max-width: 520px; margin: 0 auto; animation: compact-enter .28s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes compact-enter { from { opacity: 0; transform: translateY(9px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .compact-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:28px; }
    .compact-brand { display:flex; align-items:center; gap:10px; }
    .compact-brand img { width:30px; height:30px; }
    .compact-brand div { display:grid; gap:2px; }
    .compact-brand strong { font-size:15px; font-weight:600; }
    .compact-brand span { color:#8a97ad; font-size:11px; }
    .compact-controls { display:flex; gap:7px; }
    .compact-icon { display:grid; width:34px; height:34px; place-items:center; color:#aebbd0; background:rgba(138,151,173,.07); border:1px solid rgba(138,151,173,.16); border-radius:5px; }
    .compact-icon svg { width:17px; height:17px; }
    .compact-total { padding:19px 0 16px; border-bottom:1px solid rgba(138,151,173,.14); }
    .compact-total > span { color:#8a97ad; font-size:12px; }
    .compact-total strong { display:block; margin:9px 0 6px; font-size:clamp(30px,8vw,42px); font-weight:600; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
    .compact-total small { color:#718099; font-size:10px; }
    .compact-section { margin-top:23px; }
    .compact-section h2 { margin:0 0 10px; color:#dce4f1; font-size:13px; font-weight:600; }
    .compact-event { display:grid; grid-template-columns:42px minmax(0,1fr) auto; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid rgba(138,151,173,.1); }
    .compact-event-date { display:grid; justify-items:center; gap:2px; padding:6px 3px; background:rgba(91,141,239,.1); border-radius:4px; }
    .compact-event-date strong { color:#dce7ff; font-size:15px; font-variant-numeric:tabular-nums; }
    .compact-event-date span { color:#8ea9dc; font-size:9px; text-transform:uppercase; }
    .compact-event-copy { display:grid; gap:3px; min-width:0; }
    .compact-event-copy strong { overflow:hidden; color:#e6ecf5; font-size:11px; font-weight:500; text-overflow:ellipsis; white-space:nowrap; }
    .compact-event-copy span { overflow:hidden; color:#8a97ad; font-size:10px; text-overflow:ellipsis; white-space:nowrap; }
    .compact-event-value { color:#cbd5e4; font-size:10px; text-align:right; font-variant-numeric:tabular-nums; }
    .compact-empty { padding:13px 0; color:#77859c; font-size:11px; }
    .compact-foot { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:24px; padding-top:13px; border-top:1px solid rgba(138,151,173,.13); }
    .compact-foot span { color:#718099; font-size:10px; }
    .compact-foot button { padding:7px 9px; color:#c5d5f5; background:rgba(91,141,239,.1); border:1px solid rgba(91,141,239,.2); border-radius:4px; font-size:10px; cursor:pointer; }
    .compact-loading { color:#8a97ad; font-size:12px; }
    @media (max-width:420px) { body.compact-body { padding:15px; } .compact-controls { gap:5px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body class="compact-body">
  <main class="compact-shell">
    <header class="compact-head">
      <div class="compact-brand"><img src="/brand/svg/lastro-symbol-color.svg" alt=""><div><strong>Lastro.app</strong><span>Visão rápida</span></div></div>
      <div class="compact-controls">
        <button type="button" class="compact-icon" id="compactRefresh" aria-label="Atualizar" title="Atualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5M5.6 9a7 7 0 0 1 11.55-2.6L20 12M4 12l2.85 5.6A7 7 0 0 0 18.4 15"/></svg></button>
        <button type="button" class="compact-icon" id="compactClose" aria-label="Fechar" title="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m18 6-12 12M6 6l12 12"/></svg></button>
      </div>
    </header>
    <section class="compact-total"><span>Patrimônio investido</span><strong id="compactTotal">Carregando…</strong><small id="compactUpdated">Buscando o último saldo</small></section>
    <section class="compact-section"><h2>Próximos eventos</h2><div id="compactEvents" class="compact-loading">Carregando agenda…</div></section>
    <footer class="compact-foot"><span>Seus dados ficam neste computador.</span><button type="button" id="compactOpenMain">Abrir carteira completa</button></footer>
  </main>
  <script>
    const money = value => localStorage.getItem('rendidiario_privacy') === 'true'
      ? 'R$ ••••••'
      : new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(value) || 0);
    async function refreshCompact() {
      const total = document.getElementById('compactTotal');
      const updated = document.getElementById('compactUpdated');
      const eventsRoot = document.getElementById('compactEvents');
      total.textContent = 'Carregando…';
      try {
        const [analyticsResponse, eventsResponse] = await Promise.all([fetch('/api/analytics'), fetch('/api/calendar')]);
        if (!analyticsResponse.ok || !eventsResponse.ok) throw new Error('Não foi possível buscar os dados locais.');
        const analytics = await analyticsResponse.json();
        const events = await eventsResponse.json();
        const summary = analytics.summary || {};
        let amount = Number(summary.total_net) || 0;
        if (localStorage.getItem('lastro_include_usd') === 'true') {
          amount += (Number(localStorage.getItem('lastro_usd_amount')) || 0) * (Number(localStorage.getItem('lastro_dollar_rate')) || 0);
        }
        total.textContent = money(amount);
        updated.textContent = summary.latest_date ? `Saldo registrado em ${new Date(`${summary.latest_date}T00:00:00`).toLocaleDateString('pt-BR')}` : 'Registre o primeiro saldo para começar';
        const now = new Date(); now.setHours(0,0,0,0);
        const upcoming = events.filter(item => item.event_date && new Date(`${item.event_date}T00:00:00`) >= now).slice(0, 5);
        if (!upcoming.length) {
          eventsRoot.innerHTML = '<div class="compact-empty">Nenhum vencimento ou rendimento previsto.</div>';
          return;
        }
        eventsRoot.innerHTML = upcoming.map(item => {
          const date = new Date(`${item.event_date}T00:00:00`);
          const type = item.type === 'maturity' ? 'Vencimento' : item.type === 'interest' ? 'Juros' : 'Dividendos';
          const label = item.title || type;
          const val = item.status === 'received' ? item.received_amount : item.estimated_amount;
          return `<article class="compact-event"><div class="compact-event-date"><strong>${date.toLocaleDateString('pt-BR',{day:'2-digit'})}</strong><span>${date.toLocaleDateString('pt-BR',{month:'short'})}</span></div><div class="compact-event-copy"><strong>${label.replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}</strong><span>${type} · ${String(item.investment_name || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}${item.status === 'received' ? ' · recebido' : ' · estimativa'}</span></div><div class="compact-event-value">${val === null || val === undefined ? '—' : money(val)}</div></article>`;
        }).join('');
      } catch (error) {
        total.textContent = 'Indisponível';
        updated.textContent = error.message;
        eventsRoot.innerHTML = '<div class="compact-empty">Confira se o Lastro está aberto e tente atualizar.</div>';
      }
    }
    document.getElementById('compactRefresh').addEventListener('click', refreshCompact);
    document.getElementById('compactClose').addEventListener('click', () => {
      if (window.lastroDesktop?.closeCompactWindow) window.lastroDesktop.closeCompactWindow();
      else if (window.opener) window.close();
      else window.location.href = '/';
    });
    document.getElementById('compactOpenMain').addEventListener('click', () => {
      if (window.lastroDesktop?.openMainWindow) window.lastroDesktop.openMainWindow();
      else window.location.href = '/';
    });
    refreshCompact();
  </script>
</body>
</html>
